<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">How a prediction market is resolved</title>
  <desc id="desc">A prediction market lists a market from the Market Registry. When the event ends, a Chainlink decentralized oracle network fetches several independent data providers, checks that they agree, and applies the market's rule. The outcome is delivered to the prediction market, which settles positions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#375bd2"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172b4d} .num{font-size:15px;font-weight:700;fill:#fff} .title{font-size:17px;font-weight:700} .label{font-size:14px} .note{font-size:14px;fill:#5e6c84} .box{fill:#f3f6ff;stroke:#375bd2;stroke-width:2} .don{fill:#375bd2;stroke:#375bd2;stroke-width:2} .pm{fill:#fff;stroke:#172b4d;stroke-width:2;stroke-dasharray:6 4} .line{fill:none;stroke:#375bd2;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="330" rx="16" fill="#fff"/>

  <rect x="20" y="70" width="180" height="150" rx="12" class="box"/>
  <circle cx="44" cy="94" r="14" fill="#375bd2"/><text x="44" y="99" text-anchor="middle" class="num">1</text>
  <text x="110" y="132" text-anchor="middle" class="title">List</text>
  <text x="110" y="160" text-anchor="middle" class="label">A market from the</text>
  <text x="110" y="181" text-anchor="middle" class="label">registry, with its</text>
  <text x="110" y="202" text-anchor="middle" class="label">resolution criteria</text>

  <rect x="235" y="70" width="180" height="150" rx="12" class="box"/>
  <circle cx="259" cy="94" r="14" fill="#375bd2"/><text x="259" y="99" text-anchor="middle" class="num">2</text>
  <text x="325" y="132" text-anchor="middle" class="title">Event ends</text>
  <text x="325" y="160" text-anchor="middle" class="label">Providers report</text>
  <text x="325" y="181" text-anchor="middle" class="label">a final result</text>

  <rect x="450" y="55" width="200" height="180" rx="12" class="don"/>
  <circle cx="474" cy="79" r="14" fill="#fff"/><text x="474" y="84" text-anchor="middle" class="num" style="fill:#375bd2">3</text>
  <text x="550" y="117" text-anchor="middle" class="title" style="fill:#fff">Decide on the DON</text>
  <text x="550" y="147" text-anchor="middle" class="label" style="fill:#fff">Fetch independent</text>
  <text x="550" y="168" text-anchor="middle" class="label" style="fill:#fff">providers, require</text>
  <text x="550" y="189" text-anchor="middle" class="label" style="fill:#fff">agreement, apply</text>
  <text x="550" y="210" text-anchor="middle" class="label" style="fill:#fff">the market's rule</text>

  <rect x="685" y="70" width="180" height="150" rx="12" class="box"/>
  <circle cx="709" cy="94" r="14" fill="#375bd2"/><text x="709" y="99" text-anchor="middle" class="num">4</text>
  <text x="775" y="132" text-anchor="middle" class="title">Deliver</text>
  <text x="775" y="160" text-anchor="middle" class="label">Outcome sent to</text>
  <text x="775" y="181" text-anchor="middle" class="label">your platform</text>
  <text x="775" y="202" text-anchor="middle" class="label">as agreed</text>

  <rect x="900" y="70" width="180" height="150" rx="12" class="pm"/>
  <circle cx="924" cy="94" r="14" fill="#172b4d"/><text x="924" y="99" text-anchor="middle" class="num">5</text>
  <text x="990" y="132" text-anchor="middle" class="title">Settle</text>
  <text x="990" y="160" text-anchor="middle" class="label">Your platform</text>
  <text x="990" y="181" text-anchor="middle" class="label">settles</text>
  <text x="990" y="202" text-anchor="middle" class="label">positions</text>

  <path d="M200 145H229" class="line"/>
  <path d="M415 145H444" class="line"/>
  <path d="M650 145H679" class="line"/>
  <path d="M865 145H894" class="line"/>

  <text x="550" y="285" text-anchor="middle" class="note">If providers disagree or a result is not final, no outcome is sent. Solid boxes run on Chainlink; the dashed box is your platform.</text>
</svg>
