<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">Event status transitions</title>
  <desc id="desc">An event starts as scheduled and moves to live when it starts, then to final when it ends, then to completed when resolution and delivery finish. A final event moves to unsafe on an evidence conflict or gap, and back to final when the evidence resolves. A scheduled or live event can be postponed, and a postponed event returns to scheduled when rescheduled. A scheduled or live event can be cancelled. Completed and cancelled are terminal.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#375bd2"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172b4d} .state{font-size:16px;font-weight:700} .edge{font-size:13px;fill:#375bd2} .note{font-size:13px;fill:#5e6c84} .box{fill:#f3f6ff;stroke:#375bd2;stroke-width:2} .warn{fill:#fff4e5;stroke:#b25e09;stroke-width:2} .end{fill:#f3f6ff;stroke:#172b4d;stroke-width:3} .line{fill:none;stroke:#375bd2;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="860" height="400" rx="16" fill="#fff"/>

  <rect x="30" y="160" width="150" height="56" rx="10" class="box"/>
  <text x="105" y="194" text-anchor="middle" class="state">scheduled</text>

  <rect x="250" y="160" width="150" height="56" rx="10" class="box"/>
  <text x="325" y="194" text-anchor="middle" class="state">live</text>

  <rect x="470" y="160" width="150" height="56" rx="10" class="box"/>
  <text x="545" y="194" text-anchor="middle" class="state">final</text>

  <rect x="690" y="160" width="150" height="56" rx="10" class="end"/>
  <text x="765" y="194" text-anchor="middle" class="state">completed</text>

  <rect x="140" y="300" width="150" height="56" rx="10" class="box"/>
  <text x="215" y="334" text-anchor="middle" class="state">postponed</text>

  <rect x="470" y="300" width="150" height="56" rx="10" class="warn"/>
  <text x="545" y="334" text-anchor="middle" class="state">unsafe</text>

  <rect x="250" y="40" width="150" height="56" rx="10" class="end"/>
  <text x="325" y="74" text-anchor="middle" class="state">cancelled</text>

  <path d="M180 188H244" class="line"/>
  <text x="212" y="178" text-anchor="middle" class="edge">starts</text>
  <path d="M400 188H464" class="line"/>
  <text x="432" y="178" text-anchor="middle" class="edge">ends</text>
  <path d="M620 188H684" class="line"/>
  <text x="652" y="150" text-anchor="middle" class="edge">resolved and</text>
  <text x="652" y="166" text-anchor="middle" class="edge">delivered</text>

  <path d="M530 216V294" class="line"/>
  <text x="522" y="262" text-anchor="end" class="edge">conflict or gap</text>
  <path d="M560 300V222" class="line"/>
  <text x="568" y="262" class="edge">evidence resolves</text>

  <path d="M150 216L190 294" class="line"/>
  <text x="184" y="246" class="edge">delayed</text>
  <path d="M300 216L260 294" class="line"/>
  <text x="300" y="262" class="edge">suspended</text>
  <path d="M170 300L120 222" class="line"/>
  <text x="134" y="282" text-anchor="end" class="edge">rescheduled</text>

  <path d="M105 160V68H244" class="line"/>
  <text x="112" y="120" class="edge">cancelled</text>
  <path d="M325 160V102" class="line"/>
  <text x="333" y="135" class="edge">cancelled</text>

  <text x="840" y="352" text-anchor="end" class="note">Dark borders: terminal statuses.</text>
  <text x="840" y="372" text-anchor="end" class="note">unsafe is not terminal.</text>
</svg>
