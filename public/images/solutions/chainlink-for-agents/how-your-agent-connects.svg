<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 972" width="708" height="972" role="img" aria-labelledby="title desc" font-family="Inter, Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#141921">
  <title id="title">How your AI agent connects to Chainlink</title>
  <desc id="desc">A step-by-step diagram with three columns: you, your AI agent, and Chainlink. The Chainlink column has two separate parts: Chainlink for Agents, which is the service your agent uses, and the Chainlink platform, which is the web app you use. The first phase is sign-up. In step 1, you give your agent the skills repo link. In step 2, your agent creates its own key and address, and the key stays on its machine. In step 3, your agent shares its address and asks you to fund it. In step 4, you send a few USDC on Base to that address. In step 5, your agent accepts the Terms of Service on your behalf, pays a small sign-up fee, and registers with Chainlink for Agents. The second phase is linking. In step 6, you enter your agent's address in the Chainlink platform and create a one-time link request. In step 7, you give your agent the link request. In step 8, your agent signs it and gives you the signature. In step 9, you paste the signature into the Chainlink platform, and your agent is linked to your organization. The third phase is setting guardrails. In step 10, you use the Chainlink platform to set what your agent can do and how much it can spend. The last phase is running workflows. In step 11, your agent runs a workflow through Chainlink for Agents, which checks it against the guardrails you set in the Chainlink platform.</desc>
  <defs>
    <!-- Chainlink logo mark, copied from src/components/github-card/icons/chainlink-svg-card.svg -->
    <symbol id="chainlink-logo" viewBox="-4.1 -1.2 46 46">
      <path fill="#0847F7" d="M18.9,0l-4,2.3L4,8.6,0,10.9V32.7L4,35l11,6.3,4,2.3,4-2.3L33.8,35l4-2.3V10.9l-4-2.3L22.9,2.3ZM8,28.1V15.5L18.9,9.2l10.9,6.3V28.1L18.9,34.4Z"/>
    </symbol>
    <!-- Agent robot, copied from public/images/solutions/chainlink-for-agents/agent-robot.svg -->
    <symbol id="robot" viewBox="0 0 48 48">
      <g fill="none" stroke="#141921" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="24" y1="5" x2="24" y2="11"/>
        <circle cx="24" cy="4" r="2" fill="#141921" stroke="none"/>
        <rect x="10" y="11" width="28" height="26" rx="10"/>
        <rect x="5" y="20" width="5" height="9" rx="2"/>
        <rect x="38" y="20" width="5" height="9" rx="2"/>
        <rect x="14" y="18" width="20" height="11" rx="5.5"/>
        <line x1="20" y1="22" x2="20" y2="25"/>
        <line x1="28" y1="22" x2="28" y2="25"/>
        <line x1="19" y1="33" x2="29" y2="33"/>
      </g>
    </symbol>
    <!-- Person, in the same stroke style as the robot -->
    <symbol id="person" viewBox="0 0 48 48">
      <g fill="none" stroke="#141921" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="15" r="8"/>
        <path d="M8 42c0-9 7-15 16-15s16 6 16 15"/>
      </g>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#141921"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0847f7"/>
    </marker>
    <!-- Step number badges -->
    <g id="step-1"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
    <g id="step-2"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
    <g id="step-3"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
    <g id="step-4"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
    <g id="step-5"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
    <g id="step-6"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
    <g id="step-7"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
    <g id="step-8"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
    <g id="step-9"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">9</text></g>
    <g id="step-10"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">10</text></g>
    <g id="step-11"><circle r="13" fill="#141921"/><text y="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">11</text></g>
  </defs>

  <rect width="708" height="972" fill="#ffffff"/>

  <!-- Phase bands -->
  <rect x="0" y="140" width="708" height="26" fill="#f5f7fa"/>
  <rect x="0" y="514" width="708" height="26" fill="#f5f7fa"/>
  <rect x="0" y="750" width="708" height="26" fill="#f5f7fa"/>
  <rect x="0" y="828" width="708" height="26" fill="#f5f7fa"/>

  <!-- Lifelines: gray for you and your agent, brand blue for the two Chainlink parts -->
  <g stroke="#6c7585" stroke-width="1.25" stroke-dasharray="3 5">
    <line x1="36" y1="118" x2="36" y2="962"/>
    <line x1="210" y1="118" x2="210" y2="962"/>
  </g>
  <g stroke="#0847f7" stroke-width="1.25" stroke-dasharray="3 5">
    <line x1="416" y1="130" x2="416" y2="962"/>
    <line x1="608" y1="130" x2="608" y2="962"/>
  </g>

  <!-- Phase titles, on a full-height backing so the lifeline pauses at each band -->
  <rect x="8" y="140" width="70" height="26" fill="#f5f7fa"/>
  <rect x="8" y="514" width="66" height="26" fill="#f5f7fa"/>
  <rect x="8" y="750" width="118" height="26" fill="#f5f7fa"/>
  <rect x="8" y="828" width="126" height="26" fill="#f5f7fa"/>
  <g font-weight="700">
    <text x="14" y="158">Sign up</text>
    <text x="14" y="532">Link</text>
    <text x="14" y="768">Set guardrails</text>
    <text x="14" y="846">Run workflows</text>
  </g>

  <!-- Column headers -->
  <g font-size="18" font-weight="700" text-anchor="middle">
    <text x="36" y="30">You</text>
    <text x="210" y="30">Your AI agent</text>
    <text x="512" y="30">Chainlink</text>
  </g>
  <use href="#person" x="12" y="64" width="48" height="48"/>
  <use href="#robot" x="184" y="62" width="52" height="52"/>

  <!-- The Chainlink column: two separate parts, each with the logo mark -->
  <rect x="324" y="46" width="184" height="84" rx="10" fill="#eff6ff" stroke="#0847f7" stroke-width="1.5"/>
  <use href="#chainlink-logo" x="402" y="54" width="28" height="28"/>
  <text x="416" y="99" font-weight="700" text-anchor="middle">Chainlink for Agents</text>
  <text x="416" y="118" fill="#4e5560" text-anchor="middle">Service your agent uses</text>
  <rect x="516" y="46" width="184" height="84" rx="10" fill="#eff6ff" stroke="#0847f7" stroke-width="1.5"/>
  <use href="#chainlink-logo" x="594" y="54" width="28" height="28"/>
  <text x="608" y="99" font-weight="700" text-anchor="middle">Chainlink platform</text>
  <text x="608" y="118" fill="#4e5560" text-anchor="middle">Web app you use</text>

  <!-- Messages -->
  <g stroke="#141921" stroke-width="1.75">
    <line x1="36" y1="219" x2="208" y2="219" marker-end="url(#arrow)"/>
    <line x1="210" y1="340" x2="38" y2="340" marker-end="url(#arrow)"/>
    <line x1="36" y1="399" x2="208" y2="399" marker-end="url(#arrow)"/>
    <line x1="210" y1="496" x2="414" y2="496" marker-end="url(#arrow)"/>
    <line x1="36" y1="574" x2="606" y2="574" marker-end="url(#arrow)"/>
    <line x1="36" y1="633" x2="208" y2="633" marker-end="url(#arrow)"/>
    <line x1="210" y1="692" x2="38" y2="692" marker-end="url(#arrow)"/>
    <line x1="36" y1="732" x2="606" y2="732" marker-end="url(#arrow)"/>
    <line x1="36" y1="810" x2="606" y2="810" marker-end="url(#arrow)"/>
    <line x1="210" y1="888" x2="414" y2="888" marker-end="url(#arrow)"/>
  </g>
  <!-- Step 1 -->
  <use href="#step-1" x="54" y="183"/>
  <text x="74" y="188">Give your agent</text>
  <text x="74" y="207">the skills repo link</text>
  <!-- Step 2 -->
  <rect x="62.5" y="233" width="295" height="50" rx="8" fill="#ffffff" stroke="#141921" stroke-width="1.5"/>
  <use href="#step-2" x="86.5" y="258"/>
  <text x="106.5" y="255">Creates its own key and address.</text>
  <text x="106.5" y="274">The key stays on its machine.</text>
  <!-- Step 3 -->
  <use href="#step-3" x="54" y="304"/>
  <text x="74" y="309">Shares its address</text>
  <text x="74" y="328">and asks for funds</text>
  <!-- Step 4 -->
  <use href="#step-4" x="54" y="363"/>
  <text x="74" y="368">Send a few USDC</text>
  <text x="74" y="387">on Base</text>
  <!-- Step 5 -->
  <use href="#step-5" x="228" y="422"/>
  <text x="248" y="427">Accepts the Terms of</text>
  <text x="248" y="446">Service on your behalf,</text>
  <text x="248" y="465">pays a small sign-up</text>
  <text x="248" y="484">fee, and registers</text>
  <!-- Step 6 -->
  <use href="#step-6" x="54" y="557"/>
  <rect x="69" y="547" width="443" height="24" fill="#ffffff"/>
  <text x="74" y="562">Enter your agent’s address and create a one-time link request</text>
  <!-- Step 7 -->
  <use href="#step-7" x="54" y="597"/>
  <text x="74" y="602">Give your agent</text>
  <text x="74" y="621">the link request</text>
  <!-- Step 8 -->
  <use href="#step-8" x="54" y="656"/>
  <text x="74" y="661">Signs it and gives</text>
  <text x="74" y="680">you the signature</text>
  <!-- Step 9 -->
  <use href="#step-9" x="54" y="715"/>
  <rect x="69" y="705" width="440" height="24" fill="#ffffff"/>
  <text x="74" y="720">Paste the signature. Your agent is linked to your organization.</text>
  <!-- Step 10 -->
  <use href="#step-10" x="54" y="793"/>
  <rect x="69" y="783" width="400" height="24" fill="#ffffff"/>
  <text x="74" y="798">Set what your agent can do and how much it can spend</text>
  <!-- Step 11 -->
  <use href="#step-11" x="228" y="871"/>
  <text x="248" y="876">Runs a workflow</text>
  <!-- Guardrail check -->
  <rect x="340" y="902" width="140" height="50" rx="8" fill="#dcebff" stroke="#0847f7" stroke-width="1.5"/>
  <text x="354" y="924">Checks it against</text>
  <text x="354" y="943">your guardrails</text>
  <line x1="608" y1="927" x2="482" y2="927" stroke="#0847f7" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrow-brand)"/>
  <text x="545" y="918" text-anchor="middle">Your guardrails</text>
</svg>
