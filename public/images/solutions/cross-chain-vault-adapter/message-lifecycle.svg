<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Lifecycle of a message delivered to the Cross-Chain Vault Adapter</title>
  <desc>CCIP delivers the message and the CCIP Router calls ccipReceive on the adapter. The adapter processes the message inside a try/catch. If processing succeeds, the request is completed: the state stays NONE and the adapter emits MessageSucceeded. If processing reverts, the message becomes a failed message: the state is BASIC and the adapter emits MessageFailed. From BASIC, either a cross-chain refund (anyone can call it and the caller pays the CCIP fees; emits MessageRefunded) or a local recovery (only the local refund address can call it and there is no fee; emits MessageRecoveredLocally) moves the message to RESOLVED. A dashed branch shows a CCIP-level failure, where ccipReceive reverts or the message is rejected before the adapter records anything. It leads to manual execution after the cause is fixed, which is not possible for a malformed payload.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="650" fill="#FFFFFF"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#000000">
    <!-- CCIP delivery -->
    <rect x="100" y="20" width="320" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="260" y="45" font-size="14" text-anchor="middle">CCIP delivers the message</text>
    <text x="260" y="65" font-size="12" text-anchor="middle">The CCIP Router calls ccipReceive</text>

    <!-- CCIP-level failure branch (dashed) -->
    <line x1="420" y1="50" x2="480" y2="50" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <rect x="480" y="20" width="300" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="630" y="45" font-size="14" text-anchor="middle">CCIP-level failure</text>
    <text x="630" y="67" font-size="12" text-anchor="middle">ccipReceive reverts, or the message</text>
    <text x="630" y="85" font-size="12" text-anchor="middle">is rejected before the adapter</text>
    <text x="630" y="103" font-size="12" text-anchor="middle">records anything</text>

    <line x1="630" y1="120" x2="630" y2="160" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <rect x="480" y="160" width="300" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="630" y="185" font-size="14" text-anchor="middle">Manual execution</text>
    <text x="630" y="207" font-size="12" text-anchor="middle">After the cause is fixed</text>
    <text x="630" y="225" font-size="12" text-anchor="middle">Not possible for a malformed payload</text>

    <!-- Adapter processing -->
    <line x1="260" y1="80" x2="260" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="100" y="150" width="320" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="260" y="175" font-size="14" text-anchor="middle">Adapter processes the message</text>
    <text x="260" y="195" font-size="12" text-anchor="middle">processMessage runs in a try/catch</text>

    <!-- Outcomes -->
    <line x1="200" y1="210" x2="140" y2="290" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="158" y="254" font-size="12" text-anchor="end">Succeeds</text>
    <line x1="320" y1="210" x2="430" y2="290" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="392" y="254" font-size="12">Reverts</text>

    <rect x="20" y="290" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="140" y="315" font-size="14" text-anchor="middle">Request completed</text>
    <text x="140" y="335" font-size="12" text-anchor="middle">State NONE, MessageSucceeded</text>

    <rect x="300" y="290" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="430" y="315" font-size="14" text-anchor="middle">Failed message</text>
    <text x="430" y="335" font-size="12" text-anchor="middle">State BASIC, MessageFailed</text>

    <!-- Recovery paths -->
    <line x1="380" y1="350" x2="270" y2="420" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="480" y1="350" x2="610" y2="420" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="120" y="420" width="300" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="270" y="445" font-size="14" text-anchor="middle">Cross-chain refund</text>
    <text x="270" y="467" font-size="12" text-anchor="middle">Anyone calls, caller pays CCIP fees</text>
    <text x="270" y="487" font-size="12" text-anchor="middle">Emits MessageRefunded</text>

    <rect x="460" y="420" width="300" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="610" y="445" font-size="14" text-anchor="middle">Local recovery</text>
    <text x="610" y="467" font-size="12" text-anchor="middle">Local refund address only, no fee</text>
    <text x="610" y="487" font-size="12" text-anchor="middle">Emits MessageRecoveredLocally</text>

    <!-- Resolved -->
    <line x1="270" y1="500" x2="380" y2="570" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="610" y1="500" x2="480" y2="570" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="300" y="570" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="430" y="595" font-size="14" text-anchor="middle">Resolved</text>
    <text x="430" y="615" font-size="12" text-anchor="middle">State RESOLVED</text>
  </g>
</svg>
