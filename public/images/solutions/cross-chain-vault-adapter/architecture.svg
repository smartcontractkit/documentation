<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Cross-Chain Vault Adapter components</title>
  <desc>Components and ownership view. On the source chain, the user or app calls ccipSend on the CCIP Router. A single CCIP lane connects that router with the CCIP Router on the hub chain. On the hub chain, the factory deploys the adapter, grants its roles, and keeps none. The adapter holds its configuration (allowed source chains, allowed vaults, deposit and redeem switches, adapter fees, CCIP 2.0 settings) and three roles (DEFAULT_ADMIN_ROLE, FEE_SETTER_ROLE, FEE_COLLECTOR_ROLE). It allowlists one or more ERC-4626 vaults and is fixed to the hub chain's CCIP Router.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="610" fill="#FFFFFF"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#000000">
    <!-- Source chain region -->
    <rect x="20" y="20" width="250" height="570" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="145" y="48" font-size="14" text-anchor="middle">Source chain</text>
    <text x="145" y="66" font-size="12" text-anchor="middle">Where users send from</text>

    <rect x="50" y="110" width="190" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="145" y="135" font-size="14" text-anchor="middle">User or app</text>
    <text x="145" y="155" font-size="12" text-anchor="middle">Sends CCIP messages</text>

    <line x1="145" y1="170" x2="145" y2="500" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="155" y="340" font-size="12">Calls ccipSend</text>

    <rect x="50" y="500" width="190" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="145" y="525" font-size="14" text-anchor="middle">CCIP Router</text>
    <text x="145" y="545" font-size="12" text-anchor="middle">Collects the CCIP fee</text>

    <!-- CCIP lane between the two routers -->
    <line x1="240" y1="530" x2="440" y2="530" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="340" y="518" font-size="14" text-anchor="middle">CCIP lane</text>
    <text x="340" y="550" font-size="12" text-anchor="middle">Both directions</text>

    <!-- Hub chain region -->
    <rect x="410" y="20" width="530" height="570" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="675" y="48" font-size="14" text-anchor="middle">Hub chain</text>
    <text x="675" y="66" font-size="12" text-anchor="middle">Where the vault and adapter live</text>

    <!-- Factory -->
    <rect x="440" y="90" width="200" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="540" y="113" font-size="14" text-anchor="middle">Factory</text>
    <text x="540" y="133" font-size="12" text-anchor="middle">Grants roles, keeps none</text>

    <line x1="540" y1="146" x2="540" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="552" y="173" font-size="12">Deploys</text>

    <!-- Adapter -->
    <rect x="440" y="190" width="240" height="270" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="560" y="214" font-size="14" text-anchor="middle">Adapter</text>
    <text x="560" y="232" font-size="12" text-anchor="middle">CrossChainERC4626Adapter</text>
    <line x1="452" y1="244" x2="668" y2="244" stroke="#000000" stroke-width="1"/>
    <text x="456" y="264" font-size="14">Configuration</text>
    <text x="456" y="284" font-size="12">Allowed source chains</text>
    <text x="456" y="302" font-size="12">Allowed vaults</text>
    <text x="456" y="320" font-size="12">Deposit and redeem switches</text>
    <text x="456" y="338" font-size="12">Adapter fees</text>
    <text x="456" y="356" font-size="12">CCIP 2.0 settings</text>
    <text x="456" y="386" font-size="14">Roles</text>
    <text x="456" y="406" font-size="12">DEFAULT_ADMIN_ROLE</text>
    <text x="456" y="424" font-size="12">FEE_SETTER_ROLE</text>
    <text x="456" y="442" font-size="12">FEE_COLLECTOR_ROLE</text>

    <!-- Vaults (stacked to show one or more) -->
    <rect x="786" y="204" width="140" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="780" y="210" width="140" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="850" y="235" font-size="14" text-anchor="middle">Vaults</text>
    <text x="850" y="255" font-size="12" text-anchor="middle">ERC-4626</text>

    <line x1="680" y1="240" x2="780" y2="240" stroke="#000000" stroke-width="1.5"/>
    <text x="730" y="230" font-size="12" text-anchor="middle">Allowlists</text>

    <!-- Hub chain router -->
    <line x1="560" y1="460" x2="560" y2="500" stroke="#000000" stroke-width="1.5"/>
    <text x="572" y="485" font-size="12">Fixed router</text>

    <rect x="440" y="500" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="560" y="525" font-size="14" text-anchor="middle">CCIP Router</text>
    <text x="560" y="545" font-size="12" text-anchor="middle">Delivers and sends messages</text>
  </g>
</svg>
