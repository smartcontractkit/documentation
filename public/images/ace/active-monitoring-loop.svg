<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 230" width="990" height="230" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="990" height="230" fill="#fff"/>

  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="20" y="30" width="200" height="110"/>
    <rect x="270" y="30" width="200" height="110"/>
    <rect x="520" y="30" width="200" height="110"/>
    <rect x="770" y="30" width="200" height="110"/>
  </g>

  <g fill="#000" text-anchor="middle">
    <g font-size="18" font-weight="bold">
      <text x="120" y="64">1. Detect</text>
      <text x="370" y="64">2. Decide</text>
      <text x="620" y="64">3. Act</text>
      <text x="870" y="64">4. Prove</text>
    </g>
    <g font-size="14">
      <text x="120" y="90">Screen the watchlist</text>
      <text x="120" y="108">with TRM</text>
      <text x="370" y="90">Apply the rule:</text>
      <text x="370" y="108">log, flag, or enforce</text>
      <text x="620" y="90">Call the enforcement</text>
      <text x="620" y="108">function onchain</text>
      <text x="870" y="90">Keep the TRM result, rule,</text>
      <text x="870" y="108">operation, and actor</text>
    </g>
  </g>

  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="220" y1="85" x2="268" y2="85" marker-end="url(#arrow)"/>
    <line x1="470" y1="85" x2="518" y2="85" marker-end="url(#arrow)"/>
    <line x1="720" y1="85" x2="768" y2="85" marker-end="url(#arrow)"/>
    <path d="M870 140 V190 H120 V143" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>

  <text x="495" y="212" font-size="14" fill="#000" text-anchor="middle">next screening run</text>
</svg>
