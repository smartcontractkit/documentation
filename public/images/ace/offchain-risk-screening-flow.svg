<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">ACE managed offchain risk screening flow</title>
  <desc id="desc">An application requests an evaluation from ACE. A managed CRE workflow screens addresses with TRM, writes an approved permit to the CADV contract, and the application submits the protected transaction after the permit is ready.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#375bd2" />
    </marker>
    <style>
      .box { fill: #fff; stroke: #d6d9e0; stroke-width: 2; rx: 16; }
      .accent { fill: #f1f5ff; stroke: #375bd2; stroke-width: 2; rx: 16; }
      .title { fill: #161b26; font: 600 22px Arial, sans-serif; text-anchor: middle; }
      .body { fill: #4c5367; font: 16px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #375bd2; font: 600 15px Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #375bd2; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="560" fill="#fafbfc" rx="24" />

  <rect class="box" x="60" y="80" width="250" height="120" />
  <text class="title" x="185" y="130">Application</text>
  <text class="body" x="185" y="166">Describes the transaction</text>

  <rect class="accent" x="410" y="80" width="270" height="120" />
  <text class="title" x="545" y="130">ACE Evaluation API</text>
  <text class="body" x="545" y="166">Creates the evaluation</text>

  <rect class="accent" x="780" y="80" width="270" height="120" />
  <text class="title" x="915" y="130">Managed CRE workflow</text>
  <text class="body" x="915" y="166">Applies the risk policy</text>

  <rect class="box" x="1150" y="80" width="230" height="120" />
  <text class="title" x="1265" y="130">TRM</text>
  <text class="body" x="1265" y="166">Screens wallet addresses</text>

  <path class="arrow" d="M 310 140 L 400 140" />
  <text class="label" x="355" y="120">POST /evaluate</text>

  <path class="arrow" d="M 680 140 L 770 140" />
  <text class="label" x="725" y="120">Trigger</text>

  <path class="arrow" d="M 1050 140 L 1140 140" />
  <text class="label" x="1095" y="120">Screen</text>

  <path class="arrow" d="M 1265 210 C 1265 280, 1050 270, 1050 350" />
  <text class="label" x="1190" y="282">Approved</text>

  <rect class="accent" x="790" y="350" width="310" height="130" />
  <text class="title" x="945" y="400">CADV contract</text>
  <text class="body" x="945" y="436">Stores the single-use permit</text>

  <rect class="box" x="390" y="350" width="290" height="130" />
  <text class="title" x="535" y="400">Protected transaction</text>
  <text class="body" x="535" y="436">Matches and consumes permit</text>

  <path class="arrow" d="M 790 415 L 690 415" />
  <text class="label" x="740" y="395">Permit ready</text>

  <path class="arrow" d="M 390 415 C 250 415, 185 340, 185 210" />
  <text class="label" x="260" y="385">Submit after polling</text>
</svg>