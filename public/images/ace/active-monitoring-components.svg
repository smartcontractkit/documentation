<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="950" height="500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="950" height="500" fill="#fff"/>

  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="20" y="20" width="230" height="80"/>
    <rect x="20" y="190" width="230" height="100"/>
    <rect x="360" y="190" width="230" height="100"/>
    <rect x="700" y="190" width="230" height="100"/>
    <rect x="700" y="380" width="230" height="100"/>
  </g>

  <g fill="#000" text-anchor="middle">
    <g font-size="15" font-weight="bold">
      <text x="135" y="48">TRM Wallet Screening</text>
      <text x="135" y="218">ACE Platform</text>
      <text x="475" y="218">CRE Connect</text>
      <text x="815" y="218">Your CRE Connect Wallet</text>
      <text x="815" y="408">Your token</text>
    </g>
    <g font-size="13">
      <text x="135" y="70">Returns the risk level</text>
      <text x="135" y="86">of each address</text>

      <text x="135" y="242">Stores your configuration,</text>
      <text x="135" y="260">evaluates your rules,</text>
      <text x="135" y="278">keeps decisions</text>

      <text x="475" y="246">Reads balances and</text>
      <text x="475" y="264">executes operations</text>

      <text x="815" y="242">Executes the call on</text>
      <text x="815" y="260">each network, with the</text>
      <text x="815" y="278">onchain role</text>

      <text x="815" y="432">and associated contracts run</text>
      <text x="815" y="450">the enforcement function</text>
    </g>
    <g font-size="12">
      <text x="305" y="212">Read balances,</text>
      <text x="305" y="227">send operations</text>
      <text x="645" y="212">Execute</text>
      <text x="645" y="227">the call</text>
      <text x="305" y="358">Balance and operation status</text>
    </g>
  </g>

  <g fill="#000" font-size="12">
    <text x="150" y="138">Screen the watchlist,</text>
    <text x="150" y="153">receive risk levels</text>
    <text x="800" y="332" text-anchor="end">Call the enforcement</text>
    <text x="800" y="347" text-anchor="end">function</text>
  </g>

  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="135" y1="102" x2="135" y2="188" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="250" y1="240" x2="358" y2="240" marker-end="url(#arrow)"/>
    <line x1="590" y1="240" x2="698" y2="240" marker-end="url(#arrow)"/>
    <line x1="815" y1="292" x2="815" y2="378" marker-end="url(#arrow)"/>
    <path d="M475 292 V335 H135 V294" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
</svg>
