<svg id="ccip-intents-flow" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 1200px; background-color: white;" viewBox="0 0 1200 660" role="graphics-document document" aria-roledescription="sequence" font-family="trebuchet ms, verdana, arial, sans-serif" font-size="16">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <line x1="150" y1="75" x2="150" y2="570" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="450" y1="75" x2="450" y2="570" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="750" y1="75" x2="750" y2="570" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="1050" y1="75" x2="1050" y2="570" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- Top actors -->
  <g>
    <rect x="60" y="20" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="150" y="52" text-anchor="middle" fill="#000">Your App</text>
    <rect x="360" y="20" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="450" y="52" text-anchor="middle" fill="#000">CCIP API</text>
    <rect x="660" y="20" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="750" y="52" text-anchor="middle" fill="#000">Source Chain</text>
    <rect x="960" y="20" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="1050" y="52" text-anchor="middle" fill="#000">Destination Chain</text>
  </g>

  <!-- Messages -->
  <g stroke="#000" stroke-width="1.5">
    <text x="297" y="105" text-anchor="middle" fill="#000" stroke="none">1. POST /intents/quotes</text>
    <line x1="150" y1="115" x2="444" y2="115" marker-end="url(#arrowhead)" />

    <text x="297" y="150" text-anchor="middle" fill="#000" stroke="none">quote + transaction</text>
    <line x1="450" y1="160" x2="156" y2="160" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />

    <text x="447" y="200" text-anchor="middle" fill="#000" stroke="none">2. approve inputToken spend</text>
    <line x1="150" y1="210" x2="744" y2="210" marker-end="url(#arrowhead)" />

    <text x="447" y="245" text-anchor="middle" fill="#000" stroke="none">3. submit intent transaction</text>
    <line x1="150" y1="255" x2="744" y2="255" marker-end="url(#arrowhead)" />

    <text x="447" y="290" text-anchor="middle" fill="#000" stroke="none">transactionHash</text>
    <line x1="750" y1="300" x2="156" y2="300" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />

    <text x="297" y="345" text-anchor="middle" fill="#000" stroke="none">4. GET /intents/tx/{txHash}</text>
    <line x1="150" y1="355" x2="444" y2="355" marker-end="url(#arrowhead)" />

    <text x="297" y="390" text-anchor="middle" fill="#000" stroke="none">intentId(s)</text>
    <line x1="450" y1="400" x2="156" y2="400" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />

    <text x="297" y="445" text-anchor="middle" fill="#000" stroke="none">5. GET /intents/id/{intentId}</text>
    <line x1="150" y1="455" x2="444" y2="455" marker-end="url(#arrowhead)" />

    <text x="297" y="490" text-anchor="middle" fill="#000" stroke="none">PENDING</text>
    <line x1="450" y1="500" x2="156" y2="500" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />

    <text x="297" y="535" text-anchor="middle" fill="#000" stroke="none">COMPLETED + fulfillmentTxHash</text>
    <line x1="450" y1="545" x2="156" y2="545" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />
  </g>

  <!-- Fulfillment note on destination lifeline -->
  <rect x="896" y="470" fill="#fff5ad" stroke="#aaa" width="296" height="40" rx="2" ry="2" />
  <text x="1044" y="495" text-anchor="middle" fill="#000">provider fulfills transfer</text>

  <!-- Bottom actors -->
  <g>
    <rect x="60" y="580" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="150" y="612" text-anchor="middle" fill="#000">Your App</text>
    <rect x="360" y="580" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="450" y="612" text-anchor="middle" fill="#000">CCIP API</text>
    <rect x="660" y="580" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="750" y="612" text-anchor="middle" fill="#000">Source Chain</text>
    <rect x="960" y="580" fill="#eaeaea" stroke="#666" width="180" height="55" rx="3" ry="3" class="actor" />
    <text x="1050" y="612" text-anchor="middle" fill="#000">Destination Chain</text>
  </g>
</svg>
