# Lychee Link Checker Configuration
# https://lychee.cli.rs/

# Check only local build files; never make network requests.
offline = true

# Ignore illustrative URLs inside <code>, <pre>, and Markdown code blocks.
# These are examples, not navigational links that users can click.
include_verbatim = false

# Validate standard anchors such as /page#section.
# Text fragments such as #:~:text=... remain out of scope.
include_fragments = "anchor-only"

# Resolve Astro pretty URLs to their generated index.html file.
# Do not add "." as a fallback: directories without index.html must remain errors.
index_files = ["index.html"]

# Disable the interactive progress bar in CI logs.
no_progress = true

# URLs matching these patterns are not checked.
exclude = [
    # Markdown alternatives emitted into built HTML are not part of the static site.
    '.*\.md$',

    # Generated CSS assets are outside the scope of the internal navigation check.
    'assets/.*\.css$',
    '_astro/.*\.css$',

    # Astro handles this exact route as a redirect to /ccip/directory/mainnet,
    # so no local index.html is generated for it.
    '/ccip/directory/?(?:[?#].*)?$',

    # CCIP Directory pages reuse headings that are not rendered on those pages.
    # Ignore only their fragments; the existence of each target page is still checked.
    '/ccip/directory/.*#.*$',

    # Ignore only query-dependent CCIP Directory URLs.
    # Child pages without query parameters remain fully checked.
    '/ccip/directory/.+\?.*',

    # Dynamic pages whose query parameters cannot be reproduced by the static build.
    '/data-feeds/price-feeds/addresses\?.*',
    '/data-feeds/smartdata/addresses\?.*',

    # Swagger UI creates this deep-link target client-side.
    '/api/ace/coordinator/docs#/Organizations$',

    # In offline mode, href="/" can resolve to file:/// even though the root page
    # exists in the deployed site. Match only this exact local URL.
    '^file:///$',

    # Build/runtime references that are not navigational pages.
    'sitemap-index\.xml',
    '@vite/client',

    # Connection strings found in documentation examples.
    'postgresql:',
    'mysql:',
]

# Input HTML files matching these patterns are not scanned.
# Use this only when the entire generated page is intentionally out of scope.
exclude_path = [
    'ccip/api-reference/evm/v162/.*',
    'ccip/api-reference/evm/v163/.*',
]

# Rewrite the two CCIP v2 redirects declared in vercel.json so the checker sees
# the same pages a browser would after the 301:
#   /ccip/v2/:path* -> /ccip/:path*
#   /ccip/v2        -> /ccip
# Both rules are anchored on purpose. A bare "/ccip/v2 /ccip" prefix remap would
# also rewrite unrelated paths such as /ccip/v20 into /ccip0. Lychee 0.24.2 uses
# the Rust regex crate: no look-around, and the replacement must be a URL. A bare
# "?" is a regex quantifier, so a literal question mark must be written as \?.
remap = [
    "/ccip/v2/ /ccip/",
    "/ccip/v2$ /ccip",
    "/ccip/v2# /ccip#",
    "/ccip/v2\\? /ccip?",
]